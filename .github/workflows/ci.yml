# Builds Divit, runs the tests on .NET Framework 4.8 and .NET 10, and packs the NuGet package.
# Windows, because the .NET Framework tests and the PDF tests need its runtime and fonts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Divit.sln -c Release

      - name: Test
        run: dotnet test Divit.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/Divit/Divit.csproj -c Release --no-build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/packages/

      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: artifacts/gallery/
