# Builds Divit, runs the tests on .NET Framework 4.8 and .NET 10, and packs the NuGet package.
# Windows, because the .NET Framework tests and the PDF tests need its runtime and fonts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Fonts
        shell: pwsh
        run: |
          foreach ($font in 'trebuc.ttf', 'trebucbd.ttf', 'calibri.ttf', 'cambria.ttc', 'seguisym.ttf', 'arial.ttf') {
            $here = Test-Path (Join-Path $env:WINDIR "Fonts\$font")
            echo "::notice::font $font present: $here"
          }

      - name: Build
        run: dotnet build Divit.sln -c Release

      - name: Test
        run: dotnet test Divit.sln -c Release --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack src/Divit/Divit.csproj -c Release --no-build

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: package
          path: artifacts/packages/

      - name: Upload gallery
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gallery
          path: artifacts/gallery/
